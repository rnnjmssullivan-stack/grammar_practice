<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Grammar Practice / Тренировка грамматики</title>
  <link rel="stylesheet" href="style.css">

  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="pragma" content="no-cache" />
</head>
<body>

  <!-- Верхняя панель с настройкой таймера -->
  <header class="topbar">
    <label class="setting">
      <span>Секунд на ответ / Seconds to answer:</span>
      <input id="secondsInput" type="number" min="1" max="60" value="5">
    </label>
  </header>

  <!-- Сцена -->
  <main class="stage">

    <!-- Стартовый экран -->
    <section id="startScreen" class="screen active">
      <h1>🎯 Grammar Practice</h1>
      <p class="hint">Нажми <b>Пробел</b>, чтобы начать<br><span class="en">Press <b>Space</b> to start</span></p>
    </section>

    <!-- Экран с картинкой -->
    <section id="playScreen" class="screen">
      <img id="cardImage" alt="">
    </section>

    <!-- Финал -->
    <section id="endScreen" class="screen">
      <h1>Do you want to start a new round?</h1>
      <p class="hint">Начать новый раунд? Нажми <b>Пробел</b><br><span class="en">Press <b>Space</b> to start a new round</span></p>
    </section>

    <!-- Сбоку таймер -->
    <aside id="timerBox" class="timer hidden">
      <div id="timerValue">00</div>
      <div class="timer-label">сек / sec</div>
    </aside>

  </main>

  <!-- Подсказка про звук (появляется только при проблемах) -->
  <div id="soundHint" class="sound-hint hidden">
    🔇 Нажми, чтобы разрешить звук / Tap to allow sound
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
